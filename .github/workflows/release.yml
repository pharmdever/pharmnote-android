name: Publish signed APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: pharmnote-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check version and signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines() if '=' in line)
          if os.environ['GITHUB_REF_NAME'] != 'v' + p['VERSION_NAME']:
              raise SystemExit('Tag must match VERSION_NAME in version.properties')
          if int(p['VERSION_CODE']) < 1:
              raise SystemExit('VERSION_CODE must be positive')
          if not all(os.environ.get(k) for k in ['KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']):
              raise SystemExit('Configure the four ANDROID signing secrets first. See README.')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Decode signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'pharmnote.jks'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          path.chmod(0o600)
          PY
      - name: Build signed release
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pharmnote.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and package
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Pharmnote.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/Pharmnote.apk
          python3 scripts/make-release-metadata.py
          cd release
          sha256sum Pharmnote.apk > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Pharmnote.apk release/update.json release/SHA256SUMS.txt --verify-tag --title "Pharmnote $GITHUB_REF_NAME" --generate-notes
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pharmnote.jks"
