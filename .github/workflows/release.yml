name: Publish signed APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: pharmnote-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines() if '=' in line)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', p['VERSION_NAME']):
              raise SystemExit('VERSION_NAME must be major.minor.patch')
          tag = 'v' + p['VERSION_NAME']
          if os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit('Tag must match VERSION_NAME')
          if int(p['VERSION_CODE']) < 1:
              raise SystemExit('VERSION_CODE must be positive')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('RELEASE_TAG=' + tag + '\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare permanent signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: python3 scripts/prepare-signing.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed release
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and package
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Pharmnote.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/Pharmnote.apk
          python3 scripts/make-release-metadata.py
          cp signing-certificate.sha256 release/signing-certificate.sha256
          cd release
          sha256sum Pharmnote.apk > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/Pharmnote.apk release/update.json release/SHA256SUMS.txt release/signing-certificate.sha256 --target "$GITHUB_SHA" --title "Pharmnote $RELEASE_TAG" --generate-notes
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pharmnote.jks"
